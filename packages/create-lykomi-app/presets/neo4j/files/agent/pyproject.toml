[project]
name = "__PROJECT_NAME__-agent"
version = "0.0.0"
description = "FastAPI + Microsoft Agent Framework graph service for __PROJECT_NAME__."
requires-python = ">=3.12,<3.14"
dependencies = [
  "agent-framework-ag-ui>=1.1.0",
  "agent-framework-core>=1.14.0,<2",
  # Also provides FoundryEmbeddingClient, used by graph_vector_search — no
  # second SDK and no second credential story for embeddings.
  "agent-framework-foundry>=1.11.0,<2",
  "azure-identity>=1.25.1",
  "fastapi[standard]>=0.115.0",
  # Vector indexes need a 5.13+ server; any recent driver talks to one.
  "neo4j>=5.28,<7",
  # Uncomment when enabling MCPStreamableHTTPTool in app/agent.py.
  # "mcp>=1.24.0,<2",
  "pydantic>=2.12.0",
  "python-dotenv>=1.0.1",
  "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
# `auto` so an async test needs no per-test marker — the whole graph surface is
# async, and a forgotten marker silently passes without running the body.
asyncio_mode = "auto"
testpaths = ["tests"]
# `app` is not an installed package (package = false), so the agent directory
# has to be on the path for `from app import ...` to resolve.
pythonpath = ["."]

[tool.uv]
package = false
prerelease = "allow"
