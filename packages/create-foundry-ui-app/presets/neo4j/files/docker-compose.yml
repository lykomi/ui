# A local Neo4j for development.
#
#   docker compose up -d
#   uv run --project agent python scripts/seed_graph.py
#
# Browse it at http://localhost:7474 (user `neo4j`, the password below).
# Nothing here is production configuration — the credentials are fixed so the
# quickstart has no setup step, which is exactly why this file is dev-only.
services:
  neo4j:
    image: neo4j:5-community
    container_name: __PROJECT_NAME__-neo4j
    ports:
      - "7474:7474" # HTTP browser
      - "7687:7687" # Bolt
    environment:
      NEO4J_AUTH: neo4j/localdevpassword
      # Vector indexes need 5.13+; 5-community is well past that.
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p localdevpassword 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12

volumes:
  neo4j-data:
