# CI for the foundry-ui workspace.
#
# Runs the merge quality gate on every push and PR to main.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the scan can diff commit messages against the base.
          fetch-depth: 0

      # Cheapest gate, so it runs first.
      - name: Scan for sensitive information
        run: node scripts/check-sensitive-terms.mjs

      - name: Scan commit messages for sensitive information
        if: github.event_name == 'pull_request'
        run: |
          # Explicit refspec: the PR checkout resolves refs/pull/N/merge, so the
          # base branch is not guaranteed to exist as a remote-tracking ref.
          git fetch --no-tags origin \
            "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          node scripts/check-sensitive-terms.mjs \
            --range "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build + lint + typecheck + unit tests
        run: pnpm test

      - name: Check npm package contents
        run: pnpm pack:check

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke generated starter in browser
        run: pnpm smoke:starter:browser
