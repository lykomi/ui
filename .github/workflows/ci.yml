# CI for the foundry-ui workspace.
#
# Runs the merge quality gate on every push and PR to main.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the scan can diff commit messages against the base.
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # Cheapest gate, so it runs as early as it can — but after Node is
      # pinned, since the runner's default Node need not satisfy engines.node,
      # and before the install/build, which are the slow steps.
      - name: Scan for sensitive information
        run: node scripts/check-sensitive-terms.mjs

      - name: Scan commit messages for sensitive information
        if: github.event_name == 'pull_request'
        run: |
          # Explicit refspec: the PR checkout resolves refs/pull/N/merge, so the
          # base branch is not guaranteed to exist as a remote-tracking ref.
          git fetch --no-tags origin \
            "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          node scripts/check-sensitive-terms.mjs \
            --range "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build + lint + typecheck + unit tests
        run: pnpm test

      - name: Check npm package contents
        run: pnpm pack:check

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke generated starter in browser
        run: pnpm smoke:starter:browser

  neo4j-preset:
    name: Neo4j preset
    runs-on: ubuntu-latest
    services:
      # A real server, because the two claims worth testing are properties of
      # Neo4j rather than of our code: that a READ-mode session refuses a
      # write, and what the driver actually hydrates for the endpoints of a
      # bare relationship. A fake would assert only what we already believe.
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/testpassword
          NEO4J_server_memory_pagecache_size: 256M
          NEO4J_server_memory_heap_max__size: 512M
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: testpassword
      NEO4J_DATABASE: neo4j
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # The scaffolding CLI runs from `dist`, and the smoke installs the
      # generated app from freshly packed tarballs — so this has to be the
      # working tree's build, not the last release.
      - name: Build the workspace
        run: pnpm build

      # Scaffolds --preset neo4j, installs from local packs, builds it, and
      # checks the bundle: the vendor-graph chunk order, the Tailwind @source
      # that the graph chrome needs, and that the module registered its tools.
      # `--out` keeps the app for the steps below rather than a temp dir.
      - name: Scaffold and build the neo4j starter
        run: pnpm smoke:neo4j --out "$RUNNER_TEMP/neo4j-app"

      # No FOUNDRY_EMBEDDING_MODEL, so the seed skips embeddings and the vector
      # index — the graph itself needs no model, and the suite does not test
      # semantic search for that reason.
      - name: Seed the demo graph
        run: pnpm graph:seed
        working-directory: ${{ runner.temp }}/neo4j-app

      - name: Run the preset's agent tests
        run: pnpm test:agent
        working-directory: ${{ runner.temp }}/neo4j-app
