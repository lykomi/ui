# Release workflow for `@iloveagents/foundry-*` npm packages.
#
# Behaviour:
#   - On push to main, runs the Changesets action.
#   - If pending changesets exist: opens / updates a "chore: version packages"
#     PR that bumps versions + writes CHANGELOG entries.
#   - When that PR merges: this workflow re-runs, sees no pending changesets,
#     and runs `pnpm changeset publish` which publishes via NPM_TOKEN.
#
# CURRENT STATE — Path A (token-based, alpha):
#   - First publish runs with NPM_TOKEN (Granular Access Token, scope @iloveagents).
#   - After first publish creates the packages on npm, configure per-package
#     Trusted Publishing on npmjs (Packages → <pkg> → Settings → Trusted
#     publishing) for each of the four packages. Then:
#       1. Delete NPM_TOKEN secret + revoke the npm token.
#       2. Comment / remove the `NODE_AUTH_TOKEN` env line from the publish step.
#       3. The `id-token: write` permission already enables OIDC — Trusted
#          Publishing will work without the static token from that point on.
#   - See #100-B2 for the migration follow-up.

name: Release npm

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-npm
  cancel-in-progress: false

permissions:
  contents: write       # changesets action commits version bumps
  pull-requests: write  # changesets action opens Version Packages PR
  id-token: write       # required for future npm Trusted Publishing OIDC

jobs:
  release:
    name: Version + Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Create Version PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          publish: pnpm changeset:publish
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Path A: token-based first publish. Migrate to Trusted Publishing
          # OIDC after first publish creates the packages on npm.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
