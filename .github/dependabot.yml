version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ["@ag-ui/*", "@assistant-ui/*", "@azure/msal*", "@lykomi/*"]
    open-pull-requests-limit: 15

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directories:
      - /packages/create-lykomi-app/template/agent
      - /packages/create-lykomi-app/presets/*/files/agent
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns:
          [
            "agent-framework*",
            "mcp",
            "fastmcp",
            "azure-identity",
            "msal*",
            "authlib",
            "pyjwt",
            "cryptography",
            "oauthlib",
            "requests-oauthlib",
            "python-jose",
            "pyopenssl",
          ]
    open-pull-requests-limit: 15
