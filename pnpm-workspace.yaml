packages:
  - packages/*

ignoredBuiltDependencies:
  - '@swc/core'
  - esbuild

# Force a single copy of libraries that rely on React context to flow across
# the workspace (assistant-ui, react-router) — when two packages declare
# slightly different ranges, pnpm can resolve to different patch versions and
# end up with two copies in the bundle.
# Single source of truth for the singleton pins (pnpm 10 reads overrides from
# here; do NOT duplicate them in package.json `pnpm.overrides` — two copies
# drift). The meta workspace (ltwlf/lastspace-meta) mirrors these.
overrides:
  react-router: "^7.14.1"
  '@assistant-ui/react': "^0.15.1"
  '@ag-ui/client': "^0.0.52"
  '@ag-ui/core': "^0.0.52"

# Upstream StrictMode fix (assistant-ui/assistant-ui#5411, merged 2026-08-01,
# unreleased as of store 0.3.2): the React-Compiler-compiled
# NotificationManager is rebuilt on StrictMode's replay render, so useAuiState
# subscribers bind a dead manager and the composer silently ignores typing.
# Remove the patch (and this block) once @assistant-ui/store > 0.3.2 ships.
patchedDependencies:
  '@assistant-ui/store@0.3.2': patches/@assistant-ui__store@0.3.2.patch
